name: 'Invisible Unicode Check'
description: 'Block pull requests that introduce invisible or adversarial Unicode (GlassWorm, Trojan Source).'
author: 'tkm112345'

branding:
  icon: 'eye-off'
  color: 'red'

inputs:
  base-sha:
    description: 'Commit to diff against. Defaults to the pull request base, or the push event''s before SHA.'
    required: false
    default: ''
  exclude:
    description: 'Glob patterns to skip entirely, one per line or comma separated. Example: locales/**'
    required: false
    default: ''
  ignore-rules:
    description: 'Disable specific rules for specific paths, one `<glob>:<RULE_ID>[,<RULE_ID>...]` per line. Example: locales/**:IUC012'
    required: false
    default: ''

runs:
  using: 'node24'
  main: 'index.js'
